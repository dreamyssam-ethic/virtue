<body class="p-4 md:p-8">

          <option value="이해">💎 이해 (Understanding)</option>

          <option value="용기">💎 용기 (Courage)</option>
          <option value="인내">💎 인내 (Patience)</option>
          <option value="절제">💎 절제 (Self-Discipline)</option>
          <option value="열정">💎 열정 (Enthusiasm)</option>
          <option value="책임">💎 책임 (Responsibility)</option>

          <option value="창의">💎 창의 (Creativity)</option>
          <option value="겸손">💎 겸손 (Humility)</option>
          <option value="유연성">💎 유연성 (Flexibility)</option>
          <option value="협동">💎 협동 (Cooperation)</option>
          <option value="감사">💎 감사 (Gratitude)</option>
          <option value="정의">💎 정의 (Justice)</option>
          <option value="관용">💎 관용 (Tolerance)</option>
          <option value="평화">💎 평화 (Peacefulness)</option>
          <option value="긍정">💎 긍정 (Positivity)</option>
        </select>

    const imagePlaceholder = document.getElementById('image-placeholder');
    const cardEmoji = document.getElementById('card-emoji');
    const cardCharName = document.getElementById('card-char-name');
    const praiseBox = document.getElementById('praise-box');
    const praiseTitleLabel = document.getElementById('praise-title-label');
    const cardPraise = document.getElementById('card-praise');
    const cardStudentId = document.getElementById('card-student-id');
    const cardAuthor = document.getElementById('card-author');
    const cardFooter = document.getElementById('card-footer');

    // 미덕 실시간 업데이트
    virtueSelect.addEventListener('change', (e) => {
      const selected = e.target.value;
      if(virtueData[selected]) {
        cardTitle.textContent = selected;
        cardEnglish.textContent = virtueData[selected].english;
        cardDescription.textContent = virtueData[selected].description;
      }
    });

    // 캐릭터 무한 목록 클릭 리스너 보완
    document.getElementById('char-scroll-box').addEventListener('click', function(e) {
      const btn = e.target.closest('.char-btn');
      if (!btn) return;
      
      document.querySelectorAll('.char-btn').forEach(b => {
        b.classList.remove('border-amber-400', 'bg-amber-50');
        b.classList.add('border-gray-200', 'bg-gray-50');
      });
      btn.classList.add('border-amber-400', 'bg-amber-50');

      const emoji = btn.getAttribute('data-char');
      const nameText = btn.innerText.replace(emoji, '').trim();

      cardEmoji.textContent = emoji;
      cardCharName.textContent = nameText;
      
      cardImage.classList.add('hidden');
      imagePlaceholder.classList.remove('hidden');
    });

    // 이미지 파일 업로드 등록
    imageUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileName.textContent = file.name;
        const reader = new FileReader();
        reader.onload = function(event) {
          cardImage.src = event.target.result;
          cardImage.classList.remove('hidden');
          imagePlaceholder.classList.add('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

        cardEnglish.className = `${style.englishColor} font-bold tracking-widest text-xs mb-1`;
        cardTitle.className = `${style.titleColor} text-3xl tracking-wide mb-4 font-bold`;
        cardDescription.className = `${style.descColor} text-sm leading-relaxed px-2 break-keep`;
        cardFooter.className = `flex justify-between items-center text-sm font-bold ${style.footerColor} mt-4 px-1`;
        praiseBox.className = `${style.praiseBoxBg} backdrop-blur-sm rounded-2xl p-4 border border-emerald-100/50 shadow-sm min-h-[160px] flex flex-col justify-between flex-grow mb-2`;
        praiseTitleLabel.className = `text-center text-[12px] ${style.labelColor} font-extrabold mb-1.5 tracking-wide`;
        cardPraise.className = `${style.praiseTextColor} text-center leading-relaxed flex-grow flex items-center justify-center px-1 break-keep`;
      }
    });

    // 텍스트 실시간 반영
    praiseInput.addEventListener('input', (e) => {
      charCount.textContent = `${e.target.value.length} / 180자`;
      cardPraise.textContent = e.target.value || "친구들이 이곳에 남겨준 다정한 칭찬 구절을 적어줄 거예요.";
    });

    studentIdInput.addEventListener('input', (e) => cardStudentId.textContent = e.target.value || "00000");
    nameInput.addEventListener('input', (e) => cardAuthor.textContent = e.target.value || "나다운");

    // ★ 캡처 엔진
    document.getElementById('btn-save').addEventListener('click', function () {
      const targetCard = document.getElementById('card-render-area');
      const authorName = nameInput.value.trim() || "나다운";
      const virtueName = cardTitle.textContent.trim() || "미덕카드";

      const originalTransition = targetCard.style.transition;
      targetCard.style.transition = 'none';

      window.scrollTo(0, 0);

      setTimeout(() => {
        html2canvas(targetCard, {
          scale: 2, 
          useCORS: true, 
          allowTaint: true,
          backgroundColor: null,
          scrollX: 0,
          scrollY: 0,
          x: 0,
          y: 0
        }).then(canvas => {
          targetCard.style.transition = originalTransition;

          const imgData = canvas.toDataURL('image/png');
          const downloadLink = document.createElement('a');
          downloadLink.setAttribute('download', `${authorName}_${virtueName}_칭찬미덕카드.png`);
          downloadLink.setAttribute('href', imgData);
          document.body.appendChild(downloadLink);
          
          downloadLink.click();
          
          setTimeout(() => {
            document.body.removeChild(downloadLink);
          }, 100);

        }).catch(err => {
          targetCard.style.transition = originalTransition;
          alert("저장 엔진 로딩 중 문제가 발생했습니다. 브라우저 창을 껐다 켜거나 크롬 브라우저를 사용해 주세요!");
          console.error(err);
        });
      }, 50);
    });
  </script>
</body>
</html>
